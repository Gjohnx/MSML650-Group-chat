# CI: runs on every pull request and every push to main. Needs no AWS access.
#   lint   - ruff over all Python (real bugs only, see ruff.toml)
#   test   - pytest: Lambda unit tests + the load/smoke harness against a fake server
#   synth  - cdk synth of a throwaway stack, so a broken CDK change fails here, not at deploy
# deploy.yml calls this workflow first, so main only deploys when CI is green.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            tests/load/requirements.txt
            lambdas/*/requirements.txt
      - name: Install
        run: |
          pip install -r tests/requirements.txt
          for req in lambdas/*/requirements.txt; do pip install -r "$req"; done
      - name: Lint
        run: ruff check --output-format=github .
      - name: Test
        run: pytest -q

  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install -r infra/requirements.txt
          npm install -g aws-cdk
      - name: cdk synth
        working-directory: infra
        run: cdk synth -c owner=ci -q
